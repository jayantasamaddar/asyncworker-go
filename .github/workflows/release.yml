name: Release

# Changesets-driven release for this single-module repo, in one workflow.
# Every step is idempotent against "what's already true in git/GitHub", so
# the whole thing can be re-run (via workflow_dispatch) at any time with no
# extra input and no risk of double-tagging or double-releasing:
#
#   1. `changeset version` consumes every pending .changeset/*.md file,
#      bumping package.json's version (the version-tracking shim — see
#      DEVELOPMENT.md) and writing CHANGELOG.md. No changesets pending
#      means this is a no-op.
#   2. If that changed anything, the version bump is committed and pushed
#      directly to main, with [skip ci] so it doesn't retrigger this (or
#      any other push-triggered) workflow in a loop.
#   3. Whatever package.json's version now says should be tagged
#      `v<version>` gets tagged, unless that tag already exists.
#   4. Unless a GitHub Release already exists for that tag, the tagged
#      commit is built/vet/tested and published as a Release with notes
#      pulled straight from the CHANGELOG.md section Changesets wrote for
#      it — one changelog source of truth, rather than generating notes
#      separately from git log.
#
# That idempotency is also the recovery path for a partial failure (tagged
# but the release step failed, say): just re-run the workflow, by hand if
# there's nothing new to push and retrigger it automatically — steps 1-3
# see nothing left to do and skip straight to publishing the release.
#
# Requires a repo setting this file can't apply itself: if main has branch
# protection, it must allow github-actions[bot] to push directly, or step 2
# fails.

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for pending changesets
        id: pending
        run: |
          count=$(ls .changeset/*.md 2>/dev/null | grep -v '/README\.md$' | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count pending changeset(s)."

      - name: Version
        if: steps.pending.outputs.count != '0'
        run: npx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # changelog-github needs this to link PRs/commits

      - name: Commit and push version bump
        if: steps.pending.outputs.count != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md .changeset
          git commit -m "chore: version package [skip ci]"
          git push origin HEAD:main

      # Always read the current version, not just when the step above ran —
      # this is what makes a workflow_dispatch with no pending changesets
      # still resolve to something (whatever's already committed) instead
      # of having nothing to work with.
      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag exists
        id: tag-check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and push
        if: steps.tag-check.outputs.exists != 'true'
        run: |
          set -euo pipefail
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Check whether the GitHub Release already exists
        id: release-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.release-check.outputs.exists != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        if: steps.release-check.outputs.exists != 'true'
        run: go build ./...

      - name: Vet
        if: steps.release-check.outputs.exists != 'true'
        run: go vet ./...

      - name: Test
        if: steps.release-check.outputs.exists != 'true'
        run: go test ./... -race

      - name: Extract release notes
        if: steps.release-check.outputs.exists != 'true'
        run: |
          awk '/^## /{c++} c==1' CHANGELOG.md > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        if: steps.release-check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md
